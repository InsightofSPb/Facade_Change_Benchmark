<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRIVATE — blind factual review</title><style>
body{font:16px system-ui;max-width:1400px;margin:25px auto;padding:0 16px;background:#f5f6f8;color:#20242b}section{background:white;border:1px solid #ccd4de;padding:18px;margin:20px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:100%;min-height:5em}.photos{display:flex;overflow:auto;gap:12px}figure{margin:0;min-width:260px}img{max-width:520px;max-height:650px}label{display:block;margin:10px 0}button,input,select,textarea{font:inherit}
</style><h1>Blind factual review</h1><p>Пустое поле означает «не проверено». Совпадение класса не подтверждает описанное событие или его фактическую поддержку. Ошибки, пропуски и abstentions сохранены. Ключ условий хранится отдельно.</p>
<label>Рецензент <input id="reviewer"></label><button id="export">Экспортировать введённые суждения</button><p id="message" role="status"></p><main id="rows"></main>
<script type="application/json" id="data">__REVIEW_DATA__</script><script>
"use strict";
const data=JSON.parse(document.getElementById("data").textContent),editors=[];
const node=(tag,text,parent)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e};
const names={target_event_match:"Описанное событие совпадает с целевым?",claim_support:"Утверждение поддержано, опровергнуто или не разрешено?",citation_support:"Поддерживают ли цитаты это утверждение?"};
for(const item of data.cases){const section=node("section",undefined,document.getElementById("rows"));node("h2",item.blind_id,section);node("p",item.question,section);
 node("pre",JSON.stringify({task_dates:item.task_dates,execution_status:item.execution_status,error:item.error,decision:item.decision,target_event:item.target_event||"Human target not supplied: leave event match unresolved if it cannot be established",answer:item.answer,citations:item.citation_ids,audit_issues:item.audit_issues},null,2),section);
 const raw=node("details",undefined,section);node("summary","Последний исходный ответ модели",raw);node("pre",item.last_raw_response||"Нет сохранённого ответа",raw);
 for(const source of item.evidence){node("pre",JSON.stringify({evidence_id:source.evidence_id,cited:source.cited,presentation_basis:source.presentation_basis,shown_metadata:source.shown_metadata,image_sha256:source.image?.sha256},null,2),section);if(source.image){const figure=node("figure",undefined,section),img=node("img",undefined,figure);img.src=source.image.src;img.alt=source.evidence_id;img.loading="lazy"}}
 const fields={};for(const [key,values] of Object.entries(data.judgment_options)){const label=node("label",names[key],section),select=node("select",undefined,label);for(const value of values){const option=node("option",value||"— не проверено —",select);option.value=value}fields[key]=select}
 const notes=node("textarea","",section);notes.setAttribute("aria-label","Обоснование и замечания");editors.push({item,fields,notes});}
document.getElementById("export").onclick=()=>{try{const reviewer=document.getElementById("reviewer").value.trim();if(!reviewer)throw Error("Укажите рецензента");const cases=editors.filter(e=>Object.values(e.fields).some(f=>f.value)||e.notes.value.trim()).map(e=>({blind_id:e.item.blind_id,...Object.fromEntries(Object.entries(e.fields).map(([k,v])=>[k,v.value])),reviewer,notes:e.notes.value}));if(!cases.length)throw Error("Нет введённых суждений; пустые поля остаются unreviewed");const result={schema_version:1,access:"private_evaluation",kind:"www_factual_judgments",source_review_id:data.review_id,cases};const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:"application/json"})),a=document.createElement("a");a.href=url;a.download="2026-11-16-www-factual-judgments.private.json";a.click();URL.revokeObjectURL(url);document.getElementById("message").textContent="Экспортировано: "+cases.length+". Это человеческие суждения, без автоматического пересчёта accuracy."}catch(e){document.getElementById("message").textContent=e.message}};
</script></html>
