[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facade-change-benchmark"
version = "0.1.0"
description = "Reproducible facade image inventory and pair alignment"
requires-python = ">=3.9"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
align = ["opencv-python-headless==4.12.0.88"]
loftr = ["opencv-python-headless==4.12.0.88", "torch>=1.12.1", "kornia>=0.7,<0.9"]

[project.scripts]
facade = "facade_change.cli:main"

[tool.setuptools.packages.find]
include = ["facade_change*"]
