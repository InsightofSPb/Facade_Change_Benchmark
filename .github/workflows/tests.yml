name: CPU verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    # Keep an image with setup-python builds for the supported Python 3.9.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -m pip install --no-deps -e .
      - run: python -B scripts/audit_environment.py --run-tests --out runs/ci-environment
      - name: Show CPU test details
        if: always()
        run: |
          if [ -f runs/ci-environment/tests.log ]; then
            cat runs/ci-environment/tests.log
          fi
