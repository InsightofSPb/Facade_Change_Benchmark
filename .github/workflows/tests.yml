name: CPU verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -m pip install --no-deps -e .
      - run: python -B scripts/audit_environment.py --run-tests --out runs/ci-environment
