<header><h1>Проверка подготовленных ответов</h1><div>100 исходных вопросов и 6 предложений на замену · фотографии, маски и архив V4.1 · 2026-11-16</div><p>Ответы уже заполнены. Проверь снимки и формулировку, затем подтверди или поправь. Рамки предложены в координатах кропа; рисовать заново не обязательно.</p></header>

<script>
'use strict';
const data=JSON.parse(document.getElementById('review-data').textContent);
const clone=x=>JSON.parse(JSON.stringify(x));
const names={confirmed_change:'Есть изменение',confirmed_stability:'Видимое состояние стабильно',earliest_presence:'Самое раннее наблюдение',insufficient_evidence:'Недостаточно свидетельств'};
const visibility={visible:'Видно',partly_visible:'Видно частично',occluded:'Полностью закрыто',missing_coverage:'Нет покрытия',poor_quality:'Низкое качество',other:'Другое',unknown:'Не определено'};
let state=data.cases.map(c=>({question_id:c.question_id,status:'candidate',label:clone(c.label),question:c.reviewed_question,comment:'',revision:c.revision}));
let current=0,drawMode=false,activeBox=0;
const key='facade-assistant-review:'+data.candidate_sha256+':'+data.proposal_sha256;
const el=(tag,text,parent)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(parent)parent.appendChild(n);return n};
function message(text,kind='info',announce=false){
 for(const id of ['message','action-message']){const n=document.getElementById(id);if(n){n.textContent=text;n.dataset.kind=kind}}
 const notice=document.getElementById('notification');if(notice){notice.hidden=!announce;notice.textContent=announce?text:'';notice.dataset.kind=kind}
}
function validateBox(box,shape){return Array.isArray(box)&&box.length===4&&box.every(Number.isFinite)&&box[0]>=0&&box[1]>=0&&box[2]>box[0]&&box[3]>box[1]&&box[2]<=shape[1]&&box[3]<=shape[0]}
function validateRow(c,s){
 const l=s.label;if(!s.question.trim()||!l.reference_answer.trim())throw Error('Заполните вопрос и ответ');
 const allowed=c.task==='earliest_evidence'?['earliest_presence','insufficient_evidence']:['confirmed_change','confirmed_stability','insufficient_evidence'];
 if(!allowed.includes(l.assessment))throw Error('Результат несовместим с типом вопроса');
 if(!(l.observability in visibility))throw Error('Укажите видимость');
 if(!Array.isArray(l.limitations)||(l.assessment==='insufficient_evidence'&&!l.limitations.length))throw Error('Укажите ограничение');
 if(['occluded','missing_coverage'].includes(l.observability)&&l.assessment!=='insufficient_evidence')throw Error('Полностью скрытая область не даёт уверенного ответа');
 if(l.assessment==='confirmed_change'){
  if(!l.events.length)throw Error('Для локализованного изменения нужна область: включите рисование и выделите её на фото');
  const ids=new Set();for(const e of l.events){if(!e.event_id||ids.has(e.event_id)||e.region_id!==c.region_id||e.coordinate_system!=='region_crop_pixels'||!validateBox(e.bbox_xyxy,c.shape))throw Error('Некорректная область изменения');ids.add(e.event_id)}
 }else if(l.events.length)throw Error('Области событий допустимы только для изменения');
 if(l.assessment==='earliest_presence'){
  const o=c.observations.find(o=>o.id===l.earliest_observation_id);if(!o||o.date!==l.present_by||l.onset!=='unknown')throw Error('Выберите допустимое раннее наблюдение');
  if(l.question_scope!=='supplied_observations'||!s.question.includes('показанных локальных'))throw Error('Ранняя дата здесь ограничена показанными локальными наблюдениями; архивный эталон требует отдельной привязки');
 }
}
function changed(){state[current].status='candidate';save();nav();updateStatus()}
function snapshot(){return {kind:'facade_assistant_review_session',candidate_sha256:data.candidate_sha256,proposal_sha256:data.proposal_sha256,reviewer:document.getElementById('reviewer').value,states:clone(state)}}
function restore(payload){
 if(payload.kind!=='facade_assistant_review_session'||payload.candidate_sha256!==data.candidate_sha256||payload.proposal_sha256!==data.proposal_sha256||!Array.isArray(payload.states)||payload.states.length!==data.cases.length)throw Error('Сохранение относится к другому пакету');
 payload.states.forEach((s,i)=>{if(s.question_id!==data.cases[i].question_id||s.revision!==data.cases[i].revision||!['candidate','approved','rejected'].includes(s.status)||!s.label||typeof s.question!=='string'||typeof s.comment!=='string')throw Error('Неверный состав сохранения');if(s.status==='approved')validateRow(data.cases[i],s)});
 state=clone(payload.states);document.getElementById('reviewer').value=payload.reviewer||'';
}
function save(){let stored=false;try{localStorage.setItem(key,JSON.stringify(snapshot()));stored=true;message('Правки сохранены в этом браузере. Для переноса или резервной копии нажмите «Сохранить всю работу».')}catch(e){message('Браузер не сохранил правки автоматически. Используйте «Сохранить всю работу», прежде чем закрывать страницу.','error')}progress();return stored}
function progress(){document.getElementById('progress').textContent='Подтверждено '+state.filter(s=>s.status==='approved').length+' · исключено '+state.filter(s=>s.status==='rejected').length+' · осталось '+state.filter(s=>s.status==='candidate').length}
function filtered(i){const c=data.cases[i],s=state[i],f=document.getElementById('filter').value,q=document.getElementById('search').value.toLowerCase();return (!q||(c.number+' '+c.building_id+' '+c.question_id).toLowerCase().includes(q))&&(f==='all'||f==='pending'&&s.status==='candidate'||f==='priority'&&(c.confidence!=='high'||c.recommendation==='exclude')||f==='exclude'&&c.recommendation==='exclude'||f==='replacement'&&c.replacement||f==='approved'&&s.status==='approved')}
function nav(){const n=document.getElementById('navigation');n.replaceChildren();data.cases.forEach((c,i)=>{if(!filtered(i))return;const b=el('button',`${state[i].status==='approved'?'✓':state[i].status==='rejected'?'×':'○'} ${c.number}. ${c.building_id}`,n);if(i===current)b.className='active';b.onclick=()=>{current=i;drawMode=false;activeBox=0;render();nav()}});progress()}
function badge(text,p,cls){const b=el('span',text,p);b.className='badge '+(cls||'')}
function updateStatus(){
 const row=state[current],approved=row.status==='approved';
 const text=approved?'✓ Ответ подтверждён':row.status==='rejected'?'✕ Вопрос исключён':'○ Ответ ещё не подтверждён';
 for(const id of ['status','action-status']){const n=document.getElementById(id);if(n){n.textContent=text;n.dataset.status=row.status}}
 const button=document.getElementById('approve');if(button){button.textContent=approved?'✓ Ответ подтверждён':row.label.assessment==='confirmed_change'?'Подтвердить ответ и выделенные области':'Подтвердить ответ';button.disabled=approved}
}
function travel(delta){let n=current+delta;while(n>=0&&n<data.cases.length&&!filtered(n))n+=delta;if(n<0||n>=data.cases.length)return false;current=n;drawMode=false;activeBox=0;render();nav();window.scrollTo({top:0});return true}
function approveCurrent(advance=false){
 const c=data.cases[current],s=state[current];
 try{validateRow(c,s);s.status='approved';const stored=save();nav();updateStatus();if(advance)travel(1);message('✓ Ответ № '+c.number+' подтверждён. '+(stored?'Решение сохранено в этом браузере.':'Автосохранение недоступно — нажмите «Сохранить всю работу».'),'success',true)}
 catch(e){message('Не подтверждено: '+e.message,'error',true)}
}
function imageFigure(id,caption,parent){if(!id||!data.media[id])return;const f=el('figure',undefined,parent),im=el('img',undefined,f);im.src=data.media[id];im.alt=caption;im.loading='lazy';im.onclick=()=>zoom(im.src,caption);el('figcaption',caption,f)}
function zoom(src,caption){document.getElementById('zoomImage').src=src;document.getElementById('zoomCaption').textContent=caption;document.getElementById('zoom').showModal()}
function optionControl(label,values,value,parent,onchange){el('label',label,parent);const s=el('select',undefined,parent);for(const [v,t] of Object.entries(values)){const o=el('option',t,s);o.value=v}s.value=value;s.onchange=()=>onchange(s.value);return s}
function editText(label,value,parent,onchange){el('label',label,parent);const t=el('textarea',undefined,parent);t.value=value;t.oninput=()=>onchange(t.value);return t}
function setAssessment(value){drawMode=false;activeBox=0;const s=state[current];s.label.assessment=value;if(value!=='confirmed_change')s.label.events=[];if(value!=='earliest_presence'){delete s.label.earliest_observation_id;delete s.label.present_by;delete s.label.onset}else{const o=data.cases[current].observations[0];s.label.earliest_observation_id=o.id;s.label.present_by=o.date;s.label.onset='unknown';s.label.question_scope='supplied_observations'}changed();render()}
function canvasFor(c,o,parent){
 const wrap=el('div',undefined,parent);wrap.className='observation';el('p',o.date+' · '+o.id.slice(0,10),wrap);
 const canvas=el('canvas',undefined,wrap);canvas.width=c.shape[1];canvas.height=c.shape[0];const ctx=canvas.getContext('2d'),img=new Image();img.src=data.media[o.media];let drag=null,ready=false;
 function paint(preview){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);const boxes=state[current].label.events.map(e=>e.bbox_xyxy);if(preview)boxes[activeBox]=preview;boxes.forEach((b,i)=>{ctx.strokeStyle='#00f6ac';ctx.lineWidth=2;ctx.strokeRect(b[0],b[1],b[2]-b[0],b[3]-b[1]);ctx.fillStyle='#003f31';ctx.fillRect(b[0],b[1],16,15);ctx.fillStyle='white';ctx.font='11px sans-serif';ctx.fillText(String(i+1),b[0]+4,b[1]+12)})}
 img.onload=()=>{if(img.naturalWidth!==canvas.width||img.naturalHeight!==canvas.height){message('Размер изображения не совпадает с координатной сеткой');canvas.dataset.invalid='1';return}ready=true;paint()};
 const point=e=>{const b=canvas.getBoundingClientRect();return [Math.max(0,Math.min(canvas.width,(e.clientX-b.left)*canvas.width/b.width)),Math.max(0,Math.min(canvas.height,(e.clientY-b.top)*canvas.height/b.height))]};
 const box=(a,b)=>[Math.floor(Math.min(a[0],b[0])),Math.floor(Math.min(a[1],b[1])),Math.ceil(Math.max(a[0],b[0])),Math.ceil(Math.max(a[1],b[1]))];
 canvas.onpointerdown=e=>{if(!drawMode||!ready||e.button!==0||canvas.dataset.invalid)return;drag={p:point(e),id:e.pointerId};canvas.setPointerCapture(e.pointerId)};
 canvas.onpointermove=e=>{if(drag&&e.pointerId===drag.id)paint(box(drag.p,point(e)))};
 canvas.onpointerup=e=>{if(!drag||e.pointerId!==drag.id)return;const b=box(drag.p,point(e));drag=null;canvas.releasePointerCapture(e.pointerId);if(!validateBox(b,c.shape)){paint();return}const l=state[current].label;const prior=l.events[activeBox];l.events[activeBox]={event_id:prior?.event_id||'event:'+c.question_id+':'+(activeBox+1),coordinate_system:'region_crop_pixels',region_id:c.region_id,bbox_xyxy:b};changed();render()};
 canvas.onpointercancel=()=>{drag=null;if(ready)paint()};canvas.onlostpointercapture=()=>{drag=null;if(ready)paint()};
 const raw=el('button','Открыть RGB без рамок',wrap);raw.onclick=()=>zoom(data.media[o.media],o.date+' · исходный кроп '+c.shape.join('×'));
 el('p',o.classes.length?'Аннотации: '+o.classes.join(', '):'Для этого наблюдения нет привязанной маски.',wrap);
}
function render(){
 const c=data.cases[current],s=state[current],root=document.getElementById('card');root.replaceChildren();const card=el('section',undefined,root);card.className='card';
 el('h2',c.number+'. '+c.building_id,card);el('small',c.question_id,card);const badges=el('div',undefined,card);badge(c.task==='earliest_evidence'?'Раннее наблюдение':'Сравнение дат',badges);badge('Уверенность предложения: '+({high:'высокая',medium:'средняя',low:'низкая'}[c.confidence]),badges);if(c.replacement)badge('Предложение на замену',badges);const st=el('p','',card);st.id='status';updateStatus();
 if(c.recommendation==='exclude'){const p=el('p','Предлагаю исключить из основной выборки: '+c.exclusion_reason,card);p.className='warn'}
 if(c.task==='earliest_evidence'){const p=el('p','Этот черновик ранней даты относится только к показанным локальным наблюдениям. Архивные фотографии ниже — контекст и отдельные предложения; самая ранняя дата во всём архиве здесь не утверждена.',card);p.className='warn'}
 el('p','Вопрос: '+s.question,card);const imgs=el('div',undefined,card);imgs.className='images';c.observations.forEach(o=>canvasFor(c,o,imgs));
 const fields=el('div',undefined,card);fields.className='fields';const left=el('div',undefined,fields),right=el('div',undefined,fields);const allowed=c.task==='earliest_evidence'?['earliest_presence','insufficient_evidence']:['confirmed_change','confirmed_stability','insufficient_evidence'];optionControl('Предлагаемый результат',Object.fromEntries(allowed.map(v=>[v,names[v]])),s.label.assessment,left,setAssessment);optionControl('Видимость',visibility,s.label.observability,right,v=>{s.label.observability=v;changed()});
 if(s.label.assessment==='earliest_presence')optionControl('Наиболее раннее подтверждаемое локальное наблюдение',Object.fromEntries(c.observations.map(o=>[o.id,o.date+' · '+o.id.slice(0,10)])),s.label.earliest_observation_id,card,v=>{s.label.earliest_observation_id=v;s.label.present_by=c.observations.find(o=>o.id===v).date;changed()});
 editText('Ответ — уже заполнен, можно исправить',s.label.reference_answer,card,v=>{s.label.reference_answer=v;changed()});editText('Ограничения — по одному на строку',s.label.limitations.join('\n'),card,v=>{s.label.limitations=v.split('\n').map(x=>x.trim()).filter(Boolean);changed()});
 if(s.label.assessment==='confirmed_change'){
  const controls=el('div',undefined,card);controls.className='controls';el('span','Рамки: '+s.label.events.length+' · пиксели исходного кропа',controls);const b=el('button',drawMode?'Рисование включено — протяни мышью на фото':'Исправить рамку мышью',controls);b.onclick=()=>{drawMode=!drawMode;render()};
  if(s.label.events.length){optionControl('Редактируемая область',Object.fromEntries(s.label.events.map((e,i)=>[i,'Область '+(i+1)])),String(activeBox),controls,v=>{activeBox=Number(v)});const del=el('button','Удалить выбранную',controls);del.onclick=()=>{s.label.events.splice(activeBox,1);activeBox=0;changed();render()}}
  const add=el('button','Добавить область',controls);add.onclick=()=>{activeBox=s.label.events.length;drawMode=true;message('Протяните мышью на фото для новой области');render()};
 }
 const ctx=el('details',undefined,card);el('summary','Проверить маски и полные кадры',ctx);el('p','Маски показывают аннотированные классы, а не истинные временные изменения. Неразмеченный пиксель не означает здоровую поверхность. Синие контуры на полном кадре показывают проекцию кропа.',ctx);const gallery=el('div',undefined,ctx);gallery.className='context';c.observations.forEach(o=>{imageFigure(o.overlay,o.date+' · аннотации на исходной решётке',gallery);imageFigure(o.context,o.date+' · полный кадр, приватный контекст',gallery)});
 const arc=el('details',undefined,card);el('summary','Архив V4.1 — '+c.archive_ids.length+' записей на уровне здания',arc);el('p',c.archive_note,arc);const ag=el('div',undefined,arc);ag.className='context';c.archive_ids.forEach(id=>{const a=data.archive[id];if(!a)return;const f=el('figure',undefined,ag);if(a.media){const im=el('img',undefined,f);im.src=data.media[a.media];im.alt=id;im.loading='lazy';im.onclick=()=>zoom(im.src,id+' · '+a.date)}el('figcaption',id+' · '+a.date+' · '+a.title,f);if(a.url){const link=el('a','Источник',f);link.href=a.url;link.target='_blank';link.rel='noopener noreferrer'}});
 if(c.related_numbers.length)el('p','Связанные карточки / общее событие: '+c.related_numbers.join(', '),card);

 const advanced=el('details',undefined,card);el('summary','Формулировка вопроса и идентификаторы',advanced);editText('Вопрос, который получит модель',s.question,advanced,v=>{s.question=v;changed()});el('p','Текущая revision: '+c.revision+' · region: '+c.region_id,advanced);el('p','Области: '+s.label.events.map(e=>e.event_id+' '+JSON.stringify(e.bbox_xyxy)).join('; '),advanced);

function download(name,obj){const url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function decisions(reviewer){if(!reviewer.trim())throw Error('Укажите своё имя вверху страницы');const result=[];state.forEach((s,i)=>{if(s.status==='candidate')return;const c=data.cases[i];if(s.status==='approved')validateRow(c,s);const row={question_id:c.question_id,expected_revision:c.revision,status:s.status,reviewer:reviewer.trim(),private_notes:'Человек '+(s.status==='approved'?'подтвердил/исправил':'исключил')+' подготовленную карточку после визуального review. '+(s.comment||c.exclusion_reason||'')+' Источник предложений: '+data.proposal_sha256,reviewed_question:s.question};if(s.status==='approved')row.label=clone(s.label);result.push(row)});if(!result.length)throw Error('Сначала подтвердите или исключите хотя бы одну карточку');return {schema_version:1,access:'private_evaluation',kind:'facade_qa_review_decisions',candidate_sha256:data.candidate_sha256,decisions:result}}
function boot(){try{const old=localStorage.getItem(key);if(old)restore(JSON.parse(old))}catch(e){message('Автовосстановление недоступно: '+e.message)}nav();render();document.getElementById('filter').onchange=nav;document.getElementById('search').oninput=nav;document.getElementById('reviewer').oninput=save;document.getElementById('save').onclick=()=>download('2026-11-16-www-review-progress.private.json',snapshot());document.getElementById('export').onclick=()=>{try{const d=decisions(document.getElementById('reviewer').value);download('2026-11-16-www-assisted-decisions.private.json',d);message('Экспортировано '+d.decisions.length+' решений. Непроверенные карточки не включены.')}catch(e){message(e.message,'error',true)}};document.getElementById('restore').onclick=()=>document.getElementById('restoreFile').click();document.getElementById('restoreFile').onchange=async e=>{try{restore(JSON.parse(await e.target.files[0].text()));save();nav();render()}catch(error){message(error.message,'error',true)}};document.getElementById('closeZoom').onclick=()=>document.getElementById('zoom').close()}
if(!globalThis.__REVIEW_TEST__)boot();
